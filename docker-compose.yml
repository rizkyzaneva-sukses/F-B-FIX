services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dapurkasir}
      POSTGRES_USER: ${POSTGRES_USER:-dapurkasir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in EasyPanel}
    volumes:
      - dapurkasir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dapurkasir} -d ${POSTGRES_DB:-dapurkasir}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies every db/migrations/*.sql in filename order on each deploy. All migrations
  # are written to be re-runnable, so this is safe to repeat. Mounting them into
  # /docker-entrypoint-initdb.d only ever ran them into a brand-new volume, which meant
  # schema changes silently never reached an existing database.
  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in EasyPanel}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dapurkasir}
      PGDATABASE: ${POSTGRES_DB:-dapurkasir}
    entrypoint: ["sh", "/db/migrate.sh"]

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-dapurkasir}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dapurkasir}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:?set POSTGREST_JWT_SECRET in EasyPanel}
      PGRST_DB_PRE_REQUEST: public.check_request
      PGRST_JWT_ROLE_CLAIM_KEY: .db_role
      PGRST_SERVER_PORT: 3001
    expose:
      - "3001"

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BACKEND_ENABLED: "true"
        NEXT_PUBLIC_TRIAL_TOOLS: ${TRIAL_TOOLS_ENABLED:-true}
        NEXT_PUBLIC_SINGLE_TENANT: ${SINGLE_TENANT:-true}
    restart: unless-stopped
    depends_on:
      - postgrest
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BACKEND_ENABLED: "true"
      POSTGREST_URL: http://postgrest:3001
      POSTGREST_JWT_SECRET: ${POSTGREST_JWT_SECRET:?set POSTGREST_JWT_SECRET in EasyPanel}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in EasyPanel}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-DapurKasir <noreply@dapurkasir.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@dapurkasir.com}
      TRIAL_TOOLS_ENABLED: ${TRIAL_TOOLS_ENABLED:-true}
      APP_VERSION: ${APP_VERSION:-1.4.0}
      SINGLE_TENANT: ${SINGLE_TENANT:-true}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-Owner}
      BUSINESS_NAME: ${BUSINESS_NAME:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  dapurkasir_pgdata:
